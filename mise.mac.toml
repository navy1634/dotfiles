# macOS 固有のセットアップ定義（MISE_ENV=mac で読み込まれる）

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.packages]
# formula
# btop は mise の aqua バックエンドが linux 向けしか提供していない
"brew:btop" = "latest"
"brew:coreutils" = "latest"
"brew:git" = "latest"
"brew:grep" = "latest"

# Formula の導入後に、Brewfile の不足 Cask を Homebrew Bundle で適用する。
[bootstrap.hooks.post-packages]
run = "brew bundle --file=\"{{ config_root }}/Brewfile\" --no-upgrade"
